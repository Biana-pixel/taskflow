<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Tarefa | TaskFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="tarefas-container">

        <section class="tarefas-card">

            <h1 style="
                text-align: center;
                text-shadow: 0 3px 12px rgba(22, 163, 74, 0.45);
            ">
                Editar Tarefa
            </h1>

            <form method="POST">

                <div class="campo">
                    <label for="titulo">Título</label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        value="{{ tarefa.titulo }}"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>

                    <textarea
                        id="descricao"
                        name="descricao"
                    >{{ tarefa.descricao or '' }}</textarea>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" name="prioridade">

                        <option value="baixa"
                            {% if tarefa.prioridade == "baixa" %}selected{% endif %}>
                            Baixa
                        </option>

                        <option value="media"
                            {% if tarefa.prioridade == "media" %}selected{% endif %}>
                            Média
                        </option>

                        <option value="alta"
                            {% if tarefa.prioridade == "alta" %}selected{% endif %}>
                            Alta
                        </option>

                    </select>
                </div>

                <div class="campo">
                    <label for="status">Status</label>

                    <select id="status" name="status">

                        <option value="pendente"
                            {% if tarefa.status == "pendente" %}selected{% endif %}>
                            Pendente
                        </option>

                        <option value="em_andamento"
                            {% if tarefa.status == "em_andamento" %}selected{% endif %}>
                            Em andamento
                        </option>

                        <option value="concluida"
                            {% if tarefa.status == "concluida" %}selected{% endif %}>
                            Concluída
                        </option>

                    </select>
                </div>

                <div class="campo">
                    <label for="prazo">Prazo</label>

                    <input
                        type="date"
                        id="prazo"
                        name="prazo"
                        value="{{ tarefa.prazo or '' }}"
                    >
                </div>

                <button type="submit">
                    Salvar alterações
                </button>

            </form>

            <br>

            <a
                href="{{ url_for('tarefas.listar') }}"
                class="dashboard-button"
            >
                Voltar para Tarefas
            </a>

        </section>

    </main>

</body>
</html>
